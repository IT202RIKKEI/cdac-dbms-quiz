<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>C-DAC DBMS Exam Prep</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      body {
        font-family: "Inter", sans-serif;
        background-color: #0f172a;
        color: #e2e8f0;
      }
      .glass-panel {
        background: rgba(30, 41, 59, 0.7);
        backdrop-filter: blur(10px);
        border: 1px solid rgba(255, 255, 255, 0.1);
      }
      .option-btn {
        transition: all 0.2s ease-in-out;
      }
      .option-btn:hover:not(:disabled) {
        transform: translateX(5px);
        background-color: rgba(51, 65, 85, 0.8);
      }
      .option-correct {
        background-color: rgba(22, 163, 74, 0.2) !important;
        border-color: #16a34a !important;
        color: #4ade80;
      }
      .option-incorrect {
        background-color: rgba(220, 38, 38, 0.2) !important;
        border-color: #dc2626 !important;
        color: #f87171;
      }
      /* Custom Scrollbar */
      ::-webkit-scrollbar {
        width: 8px;
      }
      ::-webkit-scrollbar-track {
        background: #0f172a;
      }
      ::-webkit-scrollbar-thumb {
        background: #334155;
        border-radius: 4px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #475569;
      }
      .fade-in {
        animation: fadeIn 0.3s ease-in-out;
      }
      @keyframes fadeIn {
        from {
          opacity: 0;
          transform: translateY(10px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }
    </style>
  </head>
  <body class="min-h-screen flex flex-col">
    <!-- UI Container will be injected here -->
    <div
      id="app"
      class="flex-grow container mx-auto px-4 py-8 max-w-4xl flex flex-col"
    ></div>

    <script>
      // --- DATA ---
      let quizData = [];

      // --- CORE LOGIC ---
      let appState = {
        mode: "menu",
        questions: [],
        currentIndex: 0,
        score: 0,
        practiceAnswers: {},
        incorrectQuestionIds: [],
        incorrectAnswers: {},
        questionStats: {},
        seenQuestionIds: [],
        uncertainQuestionIds: [],
        savedReviewQuestionIds: [],
        lastOptionOrders: {},
        dailyGoal: {
          date: getLocalDateKey(),
          target: 65,
          completedQuestionIds: [],
        },
        reviewAnswers: null,
        mockAnswers: {},
        timeLeft: 45 * 60,
        timerInterval: null,
      };

      function shuffle(array) {
        let currentIndex = array.length,
          randomIndex;
        while (currentIndex != 0) {
          randomIndex = Math.floor(Math.random() * currentIndex);
          currentIndex--;
          [array[currentIndex], array[randomIndex]] = [
            array[randomIndex],
            array[currentIndex],
          ];
        }
        return array;
      }

      function getLocalDateKey(date = new Date()) {
        const year = date.getFullYear();
        const month = String(date.getMonth() + 1).padStart(2, "0");
        const day = String(date.getDate()).padStart(2, "0");
        return `${year}-${month}-${day}`;
      }

      function resetDailyGoalForToday() {
        const today = getLocalDateKey();
        if (appState.dailyGoal.date !== today) {
          appState.dailyGoal.date = today;
          appState.dailyGoal.completedQuestionIds = [];
          savePracticeState();
        }
      }

      async function init() {
        // Hiển thị trạng thái loading
        document.getElementById("app").innerHTML = `
                <div class="flex-grow flex items-center justify-center fade-in">
                    <div class="text-center text-slate-400">
                        <i class="fas fa-circle-notch fa-spin text-4xl mb-4 text-blue-500"></i>
                        <p>Đang tải dữ liệu câu hỏi...</p>
                    </div>
                </div>
            `;

        try {
          const response = await fetch("./questions.json");
          if (!response.ok) throw new Error("Network response was not ok");
          quizData = await response.json();
        } catch (error) {
          console.error("Lỗi khi tải questions.json:", error);
          document.getElementById("app").innerHTML = `
                    <div class="flex-grow flex items-center justify-center fade-in">
                        <div class="glass-panel p-8 rounded-2xl text-center border-red-500/30 w-full max-w-lg">
                            <i class="fas fa-exclamation-triangle text-5xl text-red-500 mb-4"></i>
                            <h2 class="text-xl font-bold text-white mb-2">Lỗi tải dữ liệu</h2>
                            <p class="text-slate-400 text-sm">Không thể nạp tệp <code>questions.json</code>. Vui lòng đảm bảo bạn đang mở trang qua một Web Server (chẳng hạn VSCode Live Server) thay vì mở trực tiếp file HTML (giao thức <code>file://</code>) để tránh lỗi CORS.</p>
                        </div>
                    </div>
                `;
          return;
        }

        const savedState = localStorage.getItem("cdac_practice_state");
        if (savedState) {
          try {
            const parsed = JSON.parse(savedState);
            appState.practiceAnswers = parsed.practiceAnswers || {};
            appState.incorrectQuestionIds =
              parsed.incorrectQuestionIds ||
              Object.keys(appState.practiceAnswers).filter(
                (questionId) => !appState.practiceAnswers[questionId].isCorrect,
              );
            appState.incorrectAnswers = parsed.incorrectAnswers || {};
            appState.questionStats = parsed.questionStats || {};
            appState.seenQuestionIds =
              parsed.seenQuestionIds ||
              Array.from(
                new Set([
                  ...Object.keys(appState.practiceAnswers),
                  ...Object.keys(appState.questionStats).filter(
                    (questionId) =>
                      appState.questionStats[questionId].attempts > 0,
                  ),
                ]),
              );
            appState.uncertainQuestionIds =
              parsed.uncertainQuestionIds ||
              Object.entries(appState.practiceAnswers)
                .filter(([, answer]) => answer.confident === false)
                .map(([questionId]) => questionId);
            appState.savedReviewQuestionIds =
              parsed.savedReviewQuestionIds || [];
            appState.lastOptionOrders = parsed.lastOptionOrders || {};
            appState.dailyGoal = {
              date: parsed.dailyGoal?.date || getLocalDateKey(),
              target: Number.isInteger(parsed.dailyGoal?.target)
                ? Math.min(260, Math.max(1, parsed.dailyGoal.target))
                : 65,
              completedQuestionIds: Array.isArray(
                parsed.dailyGoal?.completedQuestionIds,
              )
                ? parsed.dailyGoal.completedQuestionIds
                : [],
            };

            Object.entries(appState.practiceAnswers).forEach(
              ([questionId, answer]) => {
                if (!appState.questionStats[questionId]) {
                  appState.questionStats[questionId] = {
                    attempts: 1,
                    correct: answer.isCorrect ? 1 : 0,
                    wrong: answer.isCorrect ? 0 : 1,
                    wrongStreak: answer.isCorrect ? 0 : 1,
                    lastAnswer: null,
                    lastCorrect: answer.isCorrect,
                  };
                }
              },
            );
          } catch (e) {}
        }
        resetDailyGoalForToday();
        renderMenu();
      }

      function savePracticeState() {
        localStorage.setItem(
          "cdac_practice_state",
          JSON.stringify({
            practiceAnswers: appState.practiceAnswers,
            incorrectQuestionIds: appState.incorrectQuestionIds,
            incorrectAnswers: appState.incorrectAnswers,
            questionStats: appState.questionStats,
            seenQuestionIds: appState.seenQuestionIds,
            uncertainQuestionIds: appState.uncertainQuestionIds,
            savedReviewQuestionIds: appState.savedReviewQuestionIds,
            lastOptionOrders: appState.lastOptionOrders,
            dailyGoal: appState.dailyGoal,
          }),
        );
      }

      function markQuestionSeen(questionId) {
        const seenIds = new Set(appState.seenQuestionIds.map(String));
        if (seenIds.has(String(questionId))) return;
        seenIds.add(String(questionId));
        appState.seenQuestionIds = Array.from(seenIds);
        savePracticeState();
      }

      function getReviewQuestions() {
        const incorrectIds = new Set(appState.incorrectQuestionIds.map(String));
        const uncertainIds = new Set(appState.uncertainQuestionIds.map(String));
        const savedIds = new Set(
          appState.savedReviewQuestionIds.map(String),
        );

        return quizData
          .map((question) => {
            const stats = appState.questionStats[question.id] || {};
            const reasons = [];
            if (savedIds.has(String(question.id))) reasons.push("Đã lưu ôn thi");
            if (incorrectIds.has(String(question.id)))
              reasons.push("Trả lời sai");
            if (uncertainIds.has(String(question.id)))
              reasons.push("Chưa chắc đáp án");
            if ((stats.wrong || 0) >= 2) reasons.push(`Sai ${stats.wrong} lần`);
            return { question, reasons };
          })
          .filter((item) => item.reasons.length > 0);
      }

      function toggleSavedReviewQuestion(questionId) {
        const savedIds = new Set(
          appState.savedReviewQuestionIds.map(String),
        );
        const questionIdString = String(questionId);
        if (savedIds.has(questionIdString)) {
          savedIds.delete(questionIdString);
        } else {
          savedIds.add(questionIdString);
        }
        appState.savedReviewQuestionIds = Array.from(savedIds);
        savePracticeState();

        if (appState.mode === "review") {
          renderReviewQuestions();
        } else {
          renderPracticeUI();
        }
      }

      function getIncorrectQuestions() {
        const incorrectIds = new Set(appState.incorrectQuestionIds.map(String));
        return quizData.filter((question) =>
          incorrectIds.has(String(question.id)),
        );
      }

      function getModuleStats() {
        const modules = new Map();

        quizData.forEach((question) => {
          const key = question.module.trim().toLocaleLowerCase("vi-VN");
          if (!modules.has(key)) {
            modules.set(key, {
              name: question.module,
              total: 0,
              attempted: 0,
              correct: 0,
              attempts: 0,
            });
          }

          const moduleStats = modules.get(key);
          const stats = appState.questionStats[question.id];
          moduleStats.total++;
          if (stats && stats.attempts > 0) moduleStats.attempted++;
          if (stats) {
            moduleStats.correct += stats.correct || 0;
            moduleStats.attempts += stats.attempts || 0;
          }
        });

        return Array.from(modules.values());
      }

      function recordQuestionAttempt(questionId, answerText, isCorrect) {
        resetDailyGoalForToday();
        const stats = appState.questionStats[questionId] || {
          attempts: 0,
          correct: 0,
          wrong: 0,
          wrongStreak: 0,
          lastAnswer: null,
          lastCorrect: null,
        };

        if (stats.attempts === 0) {
          const completedIds = new Set(
            appState.dailyGoal.completedQuestionIds.map(String),
          );
          completedIds.add(String(questionId));
          appState.dailyGoal.completedQuestionIds = Array.from(completedIds);
        }

        stats.attempts++;
        if (isCorrect) {
          stats.correct++;
          stats.wrongStreak = 0;
        } else {
          stats.wrong++;
          stats.wrongStreak++;
        }
        stats.lastAnswer = answerText;
        stats.lastCorrect = isCorrect;
        appState.questionStats[questionId] = stats;
      }

      function getOptionOrder(question) {
        return question.options.map((option) =>
          JSON.stringify([option.text, option.isCorrect]),
        );
      }

      function randomizeOptionsForRetry(question) {
        const sourceQuestion = quizData.find((item) => item.id === question.id);
        const previousOrder =
          appState.lastOptionOrders[question.id] ||
          getOptionOrder(sourceQuestion);
        const previousOptions = previousOrder.map((optionKey) =>
          question.options.find(
            (option) =>
              JSON.stringify([option.text, option.isCorrect]) === optionKey,
          ),
        );
        const baselineOptions = previousOptions.every(Boolean)
          ? previousOptions
          : [...question.options];
        const baselineOrder = getOptionOrder({ options: baselineOptions });
        const shuffledOptions = [...baselineOptions];
        let hasUnmovedOption = true;
        let attempts = 0;

        while (hasUnmovedOption && attempts < 20) {
          shuffle(shuffledOptions);
          const shuffledOrder = getOptionOrder({
            options: shuffledOptions,
          });
          hasUnmovedOption = shuffledOrder.some(
            (option, index) => option === baselineOrder[index],
          );
          attempts++;
        }

        if (hasUnmovedOption && shuffledOptions.length > 1) {
          const offset =
            1 + Math.floor(Math.random() * (baselineOptions.length - 1));
          question.options = [
            ...baselineOptions.slice(offset),
            ...baselineOptions.slice(0, offset),
          ];
        } else {
          question.options = shuffledOptions;
        }

        appState.lastOptionOrders[question.id] = getOptionOrder(question);
      }

      function updateIncorrectQuestion(questionId, isCorrect, answerText) {
        const questionIdString = String(questionId);
        const incorrectIds = new Set(appState.incorrectQuestionIds.map(String));

        if (isCorrect) {
          incorrectIds.delete(questionIdString);
          delete appState.incorrectAnswers[questionId];
        } else {
          incorrectIds.add(questionIdString);
          appState.incorrectAnswers[questionId] = answerText;
        }

        appState.incorrectQuestionIds = Array.from(incorrectIds);
      }

      function resetPracticeState() {
        if (
          confirm(
            "Xóa tiến độ phiên học (đã làm, thống kê và câu sai)? Các câu bạn đã lưu hoặc đánh dấu chưa chắc để ôn trước kỳ thi và mục tiêu hôm nay sẽ được giữ lại.",
          )
        ) {
          appState.practiceAnswers = {};
          appState.incorrectQuestionIds = [];
          appState.incorrectAnswers = {};
          appState.questionStats = {};
          appState.seenQuestionIds = [];
          appState.lastOptionOrders = {};
          savePracticeState();
          startPractice();
        }
      }

      function renderMenu() {
        resetDailyGoalForToday();
        appState.mode = "menu";
        const appDiv = document.getElementById("app");
        const dailyCompleted = appState.dailyGoal.completedQuestionIds.length;
        const dailyRemaining = Math.max(
          0,
          appState.dailyGoal.target - dailyCompleted,
        );
        const dailyProgressPercent = Math.min(
          100,
          Math.round((dailyCompleted / appState.dailyGoal.target) * 100),
        );
        appDiv.innerHTML = `
                <div class="flex-grow flex items-center justify-center fade-in">
                    <div class="glass-panel p-8 rounded-2xl shadow-2xl w-full max-w-4xl text-center relative overflow-hidden">
                        <div class="absolute top-0 right-0 p-4 opacity-10">
                            <i class="fas fa-database text-9xl"></i>
                        </div>
                        <div class="mb-6 inline-block bg-blue-500/20 p-4 rounded-full text-blue-400 relative z-10">
                            <i class="fas fa-graduation-cap text-4xl"></i>
                        </div>
                        <h1 class="text-3xl font-bold text-white mb-2 relative z-10">C-DAC DBMS Simulator</h1>
                        <p class="text-slate-400 mb-8 relative z-10">Hệ thống ôn thi chứng chỉ C-DAC môn Hệ Quản Trị CSDL</p>

                        <section class="relative z-10 mb-6 rounded-xl border border-blue-500/30 bg-blue-950/30 p-5 text-left">
                            <div class="flex flex-wrap items-center justify-between gap-3 mb-3">
                                <div>
                                    <h2 class="font-bold text-white"><i class="fas fa-bullseye text-blue-400 mr-2"></i>Mục tiêu hôm nay</h2>
                                    <p class="text-sm text-slate-400 mt-1">${dailyCompleted >= appState.dailyGoal.target ? "Hoàn thành mục tiêu, làm tốt lắm!" : `Còn ${dailyRemaining} câu mới để đạt mục tiêu.`}</p>
                                </div>
                                <div class="text-right">
                                    <span class="text-2xl font-bold text-blue-300">${dailyCompleted}</span>
                                    <span class="text-slate-400"> / ${appState.dailyGoal.target} câu mới</span>
                                </div>
                            </div>
                            <div class="h-2.5 rounded-full bg-slate-800 overflow-hidden" role="progressbar" aria-label="Tiến độ mục tiêu học hôm nay" aria-valuemin="0" aria-valuemax="${appState.dailyGoal.target}" aria-valuenow="${Math.min(dailyCompleted, appState.dailyGoal.target)}">
                                <div class="h-full rounded-full bg-blue-500 transition-all duration-300" style="width: ${dailyProgressPercent}%"></div>
                            </div>
                        </section>
                        
                        <div class="grid md:grid-cols-2 xl:grid-cols-3 gap-4 relative z-10">
                            <div class="flex flex-col gap-2">
                                <button onclick="startPractice()" class="flex flex-col items-center justify-center p-6 bg-slate-800/80 hover:bg-blue-600/30 border border-slate-700 hover:border-blue-500 rounded-xl transition-all group h-full">
                                    <i class="fas fa-book-reader text-3xl text-slate-400 group-hover:text-blue-400 mb-3 transition-colors"></i>
                                    <span class="text-lg font-semibold text-white">Luyện tập (Practice)</span>
                                    <span class="text-sm text-slate-400 mt-2 text-center">Toàn bộ câu hỏi, giải thích chi tiết, lưu tiến độ</span>
                                </button>
                                ${appState.seenQuestionIds.length > 0 || Object.keys(appState.questionStats).length > 0 || Object.keys(appState.practiceAnswers).length > 0 ? `<button onclick="resetPracticeState()" class="text-xs text-slate-500 hover:text-red-400 py-1 transition-colors"><i class="fas fa-trash-alt mr-1"></i> Xóa tiến độ phiên học</button>` : ""}
                            </div>
                            
                            <div class="flex flex-col gap-2">
                                <button onclick="startMockTest()" class="flex flex-col items-center justify-center p-6 bg-slate-800/80 hover:bg-purple-600/30 border border-slate-700 hover:border-purple-500 rounded-xl transition-all group h-full">
                                    <i class="fas fa-stopwatch text-3xl text-slate-400 group-hover:text-purple-400 mb-3 transition-colors"></i>
                                    <span class="text-lg font-semibold text-white">Thi thử (Mock Test)</span>
                                    <span class="text-sm text-slate-400 mt-2 text-center">40 câu ngẫu nhiên, 45 phút, chấm điểm chuẩn</span>
                                </button>
                            </div>

                            <button onclick="startUnseenPractice()" ${getUnseenQuestions().length === 0 ? "disabled" : ""} class="flex flex-col items-center justify-center p-6 bg-slate-800/80 hover:bg-cyan-600/30 border border-slate-700 hover:border-cyan-500 rounded-xl transition-all group h-full disabled:opacity-50 disabled:cursor-not-allowed disabled:hover:bg-slate-800/80 disabled:hover:border-slate-700">
                                <i class="fas fa-circle-play text-3xl text-slate-400 group-hover:text-cyan-400 mb-3 transition-colors"></i>
                                <span class="text-lg font-semibold text-white">Câu chưa gặp</span>
                                <span class="text-sm text-slate-400 mt-2 text-center">${getUnseenQuestions().length} câu chưa gặp</span>
                            </button>

                            <button onclick="renderIncorrectQuestions()" ${getIncorrectQuestions().length === 0 ? "disabled" : ""} class="flex flex-col items-center justify-center p-6 bg-slate-800/80 hover:bg-red-600/30 border border-slate-700 hover:border-red-500 rounded-xl transition-all group h-full disabled:opacity-50 disabled:cursor-not-allowed disabled:hover:bg-slate-800/80 disabled:hover:border-slate-700">
                                <i class="fas fa-rotate-left text-3xl text-slate-400 group-hover:text-red-400 mb-3 transition-colors"></i>
                                <span class="text-lg font-semibold text-white">Làm lại câu sai</span>
                                <span class="text-sm text-slate-400 mt-2 text-center">${getIncorrectQuestions().length} câu sai</span>
                            </button>

                            <button onclick="renderReviewQuestions()" ${getReviewQuestions().length === 0 ? "disabled" : ""} class="flex flex-col items-center justify-center p-6 bg-slate-800/80 hover:bg-amber-600/30 border border-slate-700 hover:border-amber-500 rounded-xl transition-all group h-full disabled:opacity-50 disabled:cursor-not-allowed disabled:hover:bg-slate-800/80 disabled:hover:border-slate-700">
                                <i class="fas fa-list-check text-3xl text-slate-400 group-hover:text-amber-400 mb-3 transition-colors"></i>
                                <span class="text-lg font-semibold text-white">Ôn trước kỳ thi</span>
                                <span class="text-sm text-slate-400 mt-2 text-center">${getReviewQuestions().length} câu cần xem lại</span>
                            </button>
                        </div>

                        <section class="relative z-10 mt-8 text-left">
                            <div class="flex flex-wrap items-end justify-between gap-2 mb-4">
                                <div>
                                    <h2 class="text-xl font-bold text-white">Tiến độ theo chủ đề</h2>
                                    <p class="text-sm text-slate-400 mt-1">Tỷ lệ đúng tính trên tất cả lượt trả lời.</p>
                                </div>
                                <span class="text-sm text-blue-300">${appState.seenQuestionIds.length}/${quizData.length} câu đã gặp</span>
                            </div>
                            <div class="overflow-x-auto rounded-xl border border-slate-700">
                                <table class="w-full min-w-[520px] text-sm">
                                    <thead class="bg-slate-800 text-slate-400 uppercase text-xs tracking-wider">
                                        <tr>
                                            <th class="text-left px-4 py-3">Chủ đề</th>
                                            <th class="text-right px-4 py-3">Đã làm</th>
                                            <th class="text-right px-4 py-3">Lượt đúng</th>
                                            <th class="text-right px-4 py-3">Tỷ lệ đúng</th>
                                        </tr>
                                    </thead>
                                    <tbody class="divide-y divide-slate-700/70">
                                        ${getModuleStats()
                                          .map(
                                            (module) => `
                                            <tr class="bg-slate-900/40">
                                                <td class="px-4 py-3 text-slate-200">${module.name}</td>
                                                <td class="px-4 py-3 text-right text-slate-300">${module.attempted}/${module.total}</td>
                                                <td class="px-4 py-3 text-right text-green-300">${module.correct}/${module.attempts}</td>
                                                <td class="px-4 py-3 text-right font-semibold ${module.attempts && module.correct / module.attempts < 0.6 ? "text-red-300" : "text-blue-300"}">${module.attempts ? `${Math.round((module.correct / module.attempts) * 100)}%` : "—"}</td>
                                            </tr>
                                        `,
                                          )
                                          .join("")}
                                    </tbody>
                                </table>
                            </div>
                        </section>
                    </div>
                </div>
            `;
      }

      function prepareQuestions() {
        let qs = JSON.parse(JSON.stringify(quizData));
        qs.forEach((q) => {
          q.options = shuffle(q.options);
        });
        return shuffle(qs);
      }

      function startPractice() {
        appState.mode = "practice";
        appState.reviewAnswers = null;
        appState.questions = prepareQuestions();

        // Auto skip to first unanswered if there are history
        let startIdx = 0;
        for (let i = 0; i < appState.questions.length; i++) {
          if (!appState.practiceAnswers[appState.questions[i].id]) {
            startIdx = i;
            break;
          }
        }
        appState.currentIndex = startIdx;
        renderPracticeUI();
      }

      function getUnseenQuestions() {
        const seenIds = new Set(appState.seenQuestionIds.map(String));
        return quizData.filter((question) => !seenIds.has(String(question.id)));
      }

      function startUnseenPractice() {
        const seenIds = new Set(appState.seenQuestionIds.map(String));
        appState.questions = prepareQuestions().filter(
          (question) => !seenIds.has(String(question.id)),
        );
        appState.currentIndex = 0;
        appState.mode = "unseen-practice";
        appState.reviewAnswers = null;
        if (appState.questions.length === 0) {
          renderEmptyPractice(
            "Bạn đã làm hết 260 câu!",

      function startMockTest() {
        appState.mode = "mock";
        appState.reviewAnswers = null;
        // Only take up to 40 questions (or max length if < 40)

        appState.questions = prepareQuestions().slice(0, count);
        appState.currentIndex = 0;
        appState.mockAnswers = {};
        appState.timeLeft = 45 * 60;

        appState.timerInterval = setInterval(() => {
          appState.timeLeft--;
          updateTimerDisplay();
          if (appState.timeLeft <= 0) {
            submitMockTest();
          }

        renderMockUI();

      function handlePracticeAnswer(questionId, optionIndex) {
        const q = appState.questions.find((x) => x.id === questionId);
        const isCorrect = q.options[optionIndex].isCorrect;
        const answerText = q.options[optionIndex].text;
        appState.lastOptionOrders[questionId] = getOptionOrder(q);
        appState.practiceAnswers[questionId] = {
          selectedOptIdx: optionIndex,
          isCorrect: isCorrect,
          scoreDelta: isCorrect ? 1 : -0.33,
          confident: null,
        };
        recordQuestionAttempt(questionId, answerText, isCorrect);
        updateIncorrectQuestion(questionId, isCorrect, answerText);
        savePracticeState();
        renderPracticeUI();
      }

      function setAnswerConfidence(questionId, confident) {
        const answers = appState.reviewAnswers || appState.practiceAnswers;
        const answer = answers[questionId];
        if (!answer) return;

        answer.confident = confident;
        const uncertainIds = new Set(appState.uncertainQuestionIds.map(String));
        if (confident) {
          uncertainIds.delete(String(questionId));
        } else {
          uncertainIds.add(String(questionId));
        }
        appState.uncertainQuestionIds = Array.from(uncertainIds);

        if (!appState.reviewAnswers) {
          appState.practiceAnswers[questionId].confident = confident;
        }
        savePracticeState();
        renderPracticeUI();
      }

      function navPractice(dir) {
        appState.currentIndex += dir;
        renderPracticeUI();
      }

      function toggleHint(elementId) {
        const el = document.getElementById(elementId);
        if (el.classList.contains("hidden")) {
          el.classList.remove("hidden");
          el.classList.add("fade-in");
        } else {
          el.classList.add("hidden");
          el.classList.remove("fade-in");
        }
      }

                                return `
                                    <button onclick="handleMockAnswer(${q.id}, ${idx})" class="${btnClass}">
                                        <i class="${iconClass} flex-shrink-0"></i> 
                                        <span class="leading-relaxed">${opt.text}</span>
                                    </button>
                                `;
                              })
                              .join("")}
                        </div>

                        <div class="flex justify-between items-center pt-5 border-t border-slate-700 mt-auto">
                            <button onclick="navMock(-1)" class="${appState.currentIndex === 0 ? "invisible" : ""} px-4 py-2 rounded-lg bg-slate-800 border border-slate-700 hover:bg-slate-700 text-slate-300 transition-colors flex items-center">
                                <i class="fas fa-chevron-left mr-2 text-xs"></i> Câu trước
                            </button>
                            <button onclick="navMock(1)" class="${appState.currentIndex === appState.questions.length - 1 ? "invisible" : ""} px-6 py-2.5 rounded-lg bg-slate-700 hover:bg-slate-600 border border-slate-600 text-white font-medium transition-colors flex items-center shadow-md">
                                Câu sau <i class="fas fa-chevron-right ml-2 text-xs"></i>
                            </button>
                        </div>
                    </div>

                    <!-- Sidebar: Question Navigator -->
                    <div class="w-full lg:w-72 glass-panel rounded-2xl p-5 flex flex-col lg:h-[600px] lg:order-2 order-1 shadow-2xl">
                        <h3 class="text-sm font-semibold text-slate-300 mb-4 uppercase tracking-wider flex items-center border-b border-slate-700 pb-3">
                            <i class="fas fa-th mr-2"></i> Danh sách câu hỏi
                        </h3>
                        <div class="grid grid-cols-6 lg:grid-cols-4 gap-2 overflow-y-auto pr-2 custom-scrollbar">
                            ${appState.questions
                              .map((_, idx) => {
                                let statusClass =
                                  "bg-slate-800 text-slate-400 hover:bg-slate-700 border border-slate-700";
                                if (
                                  appState.mockAnswers[
                                    appState.questions[idx].id
                                  ] !== undefined
                                ) {
                                  statusClass =
                                    "bg-purple-600/50 text-white border-purple-500 shadow-inner";
                                }
                                if (appState.currentIndex === idx) {
                                  statusClass +=
                                    " ring-2 ring-white ring-offset-2 ring-offset-[#0f172a]";
                                }
                                return `<button onclick="jumpToMock(${idx})" class="w-10 h-10 rounded-lg flex items-center justify-center text-sm font-medium transition-all ${statusClass}">${idx + 1}</button>`;
                              })
                              .join("")}
                        </div>
                    </div>

                </div>
            `;
        updateTimerDisplay();
      }

      function updateTimerDisplay() {
        const el = document.getElementById("timerDisplay");
        if (!el) return;
        const m = Math.floor(appState.timeLeft / 60)
          .toString()
          .padStart(2, "0");
        const s = (appState.timeLeft % 60).toString().padStart(2, "0");
        el.innerText = `${m}:${s}`;
        if (appState.timeLeft < 300) {
          el.classList.add("text-red-400");
          el.classList.add("animate-pulse");
        }
      }

      function handleMockAnswer(qId, optIdx) {
        appState.mockAnswers[qId] = optIdx;
        const question = appState.questions.find((item) => item.id === qId);
        appState.lastOptionOrders[qId] = getOptionOrder(question);
        savePracticeState();
        // Tự động chuyển câu sau khi chọn (nếu muốn, hiện tại cứ để user bấm nút)
        renderMockUI();
      }

      function navMock(dir) {
        appState.currentIndex += dir;
        renderMockUI();
      }

      function jumpToMock(idx) {
        appState.currentIndex = idx;
        renderMockUI();
      }

      function confirmExitMock() {
        if (
          confirm(
            "Bạn có chắc chắn muốn thoát? Câu đã xem sẽ được ghi nhận, nhưng câu trả lời bài thi sẽ không được lưu.",
          )
        ) {
          clearInterval(appState.timerInterval);
          renderMenu();
        }
      }

      function submitMockTest() {
        if (appState.timeLeft > 0) {
          const unanswered =
            appState.questions.length -
            Object.keys(appState.mockAnswers).length;
          let msg = "Bạn có chắc chắn muốn nộp bài?";
          if (unanswered > 0)
            msg = `Bạn còn ${unanswered} câu chưa làm. ` + msg;
          if (!confirm(msg)) return;
        }
        clearInterval(appState.timerInterval);

        // Calculate score
        let correct = 0;
        let wrong = 0;
        let totalScore = 0;

        appState.questions.forEach((q) => {
          const ansIdx = appState.mockAnswers[q.id];
          if (ansIdx !== undefined) {
            if (q.options[ansIdx].isCorrect) {
              correct++;
              totalScore += 1;
              updateIncorrectQuestion(q.id, true);
            } else {
              wrong++;
              totalScore -= 0.33; // CDAC Negative marking
              updateIncorrectQuestion(q.id, false, q.options[ansIdx].text);
            }
            recordQuestionAttempt(
              q.id,
              q.options[ansIdx].text,
              q.options[ansIdx].isCorrect,
            );
          }
        });
        savePracticeState();

        appState.scoreResults = {
          correct,
          wrong,
          totalScore: totalScore.toFixed(2),
          unanswered: appState.questions.length - correct - wrong,
          passScore: appState.questions.length * 0.5, // 50% pass mark assumption
        };

        appState.mode = "result";
        renderResults();
      }

      function renderResults() {
        const res = appState.scoreResults;
        const isPassed = res.totalScore >= res.passScore;
        const questionReviewItems = appState.questions.map((question, index) => {
          const selectedIndex = appState.mockAnswers[question.id];
          const isAnswered = selectedIndex !== undefined;
          const isCorrect =
            isAnswered && question.options[selectedIndex].isCorrect;
          return {
            question,
            index,
            status: !isAnswered ? "unanswered" : isCorrect ? "correct" : "wrong",
            statusLabel: !isAnswered
              ? "Bỏ trống"
              : isCorrect
                ? "Đúng"
                : "Sai",
            statusClass: !isAnswered
              ? "border-slate-600 bg-slate-800 text-slate-300"
              : isCorrect
                ? "border-green-500/50 bg-green-500/10 text-green-300 hover:bg-green-500/20"
                : "border-red-500/50 bg-red-500/10 text-red-300 hover:bg-red-500/20",
          };
        });

        const passStatusHtml = isPassed
          ? '<div class="inline-flex items-center px-4 py-2 rounded-full bg-green-500/20 text-green-400 border border-green-500/30 text-lg font-bold shadow-[0_0_15px_rgba(74,222,128,0.3)]"><i class="fas fa-award mr-2 text-xl"></i> ĐẠT (PASS)</div>'
          : '<div class="inline-flex items-center px-4 py-2 rounded-full bg-red-500/20 text-red-400 border border-red-500/30 text-lg font-bold"><i class="fas fa-times-circle mr-2 text-xl"></i> CHƯA ĐẠT (FAIL)</div>';

        const appDiv = document.getElementById("app");
        appDiv.innerHTML = `
                <div class="flex-grow flex items-center justify-center fade-in py-8">
                    <div class="glass-panel p-8 md:p-12 rounded-3xl shadow-2xl w-full max-w-4xl text-center relative overflow-hidden">
                        
                        <!-- Decorative background element -->
                        <div class="absolute top-0 left-0 w-full h-40 ${isPassed ? "bg-gradient-to-b from-green-600/20" : "bg-gradient-to-b from-red-600/20"} to-transparent z-0"></div>

                        <div class="relative z-10">
                            <h2 class="text-3xl font-bold text-white mb-6 uppercase tracking-wider">Kết quả bài thi</h2>
                            
                            <div class="mb-10">${passStatusHtml}</div>

                            <div class="flex flex-col items-center justify-center mb-10">
                                <div class="text-sm text-slate-400 uppercase tracking-widest mb-2 font-semibold">Tổng điểm</div>
                                <div class="text-7xl font-bold text-white mb-2 drop-shadow-lg">
                                    ${res.totalScore}
                                </div>
                                <div class="text-lg text-slate-400 font-medium bg-slate-800/80 px-4 py-1 rounded-full border border-slate-700">/ ${appState.questions.length} điểm tối đa</div>
                                <p class="text-xs text-slate-500 mt-3">(Đúng: +1.0, Sai: -0.33, Bỏ qua: 0)</p>
                            </div>

                            <div class="grid grid-cols-3 gap-3 md:gap-6 mb-10">
                                <div class="bg-slate-800/80 p-5 rounded-2xl border-b-4 border-green-500 shadow-lg">
                                    <div class="text-4xl font-bold text-green-400 mb-1">${res.correct}</div>
                                    <div class="text-xs uppercase tracking-wider text-slate-400 font-medium">Câu đúng</div>
                                </div>
                                <div class="bg-slate-800/80 p-5 rounded-2xl border-b-4 border-red-500 shadow-lg">
                                    <div class="text-4xl font-bold text-red-400 mb-1">${res.wrong}</div>
                                    <div class="text-xs uppercase tracking-wider text-slate-400 font-medium">Câu sai</div>
                                </div>
                                <div class="bg-slate-800/80 p-5 rounded-2xl border-b-4 border-slate-500 shadow-lg">
                                    <div class="text-4xl font-bold text-slate-400 mb-1">${res.unanswered}</div>
                                    <div class="text-xs uppercase tracking-wider text-slate-400 font-medium">Bỏ qua</div>
                                </div>
                            </div>

                            <section class="text-left mb-10">
                                <div class="flex flex-wrap items-end justify-between gap-2 mb-4">
                                    <div>
                                        <h3 class="text-lg font-bold text-white">Danh sách câu hỏi</h3>
                                        <p class="text-sm text-slate-400 mt-1">Chọn câu để xem lại đáp án. Bạn vẫn có thể lướt câu trước/sau.</p>
                                    </div>
                                    <div class="flex flex-wrap gap-3 text-xs">
                                        <span class="text-green-300"><i class="fas fa-circle-check mr-1"></i>${res.correct} đúng</span>
                                        <span class="text-red-300"><i class="fas fa-circle-xmark mr-1"></i>${res.wrong} sai</span>
                                        <span class="text-slate-300"><i class="fas fa-circle-minus mr-1"></i>${res.unanswered} bỏ trống</span>
                                    </div>
                                </div>
                                <div class="grid grid-cols-1 sm:grid-cols-2 gap-2 max-h-80 overflow-y-auto pr-2">
                                    ${questionReviewItems.map((item) => `
                                        <button onclick="reviewMock(${item.index})" class="w-full text-left p-3 rounded-lg border ${item.statusClass} transition-colors flex items-center gap-3">
                                            <span class="w-9 h-9 rounded-lg bg-slate-950/40 flex items-center justify-center font-bold flex-shrink-0">${item.index + 1}</span>
                                            <span class="min-w-0 flex-grow">
                                                <span class="block text-sm font-medium">${item.question.question}</span>
                                                <span class="block text-xs mt-1 opacity-80">${item.statusLabel}</span>
                                            </span>
                                            <i class="fas ${item.status === "correct" ? "fa-check" : item.status === "wrong" ? "fa-xmark" : "fa-minus"} flex-shrink-0"></i>
                                        </button>
                                    `).join("")}
                                </div>
                            </section>

                            <div class="flex flex-col sm:flex-row justify-center gap-4">
                                <button onclick="reviewMock(0)" class="w-full sm:w-auto px-6 py-3.5 rounded-xl bg-slate-700 hover:bg-slate-600 border border-slate-600 text-white font-medium transition-colors shadow-md flex items-center justify-center">
                                    <i class="fas fa-search mr-2"></i> Xem lại đáp án
                                </button>
                                <button onclick="renderMenu()" class="w-full sm:w-auto px-8 py-3.5 rounded-xl bg-blue-600 hover:bg-blue-500 text-white font-bold transition-all shadow-lg shadow-blue-500/30 flex items-center justify-center">
                                    <i class="fas fa-home mr-2"></i> Về trang chủ
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
            `;
      }

      function reviewMock(questionIndex = 0) {
        // Chuyển UI sang dạng Practice để xem lại
        appState.mode = "mock-review";
        appState.currentIndex = questionIndex;
        appState.reviewAnswers = {};

        // Map câu trả lời từ mock sang practice để UI tự render màu sắc
        appState.questions.forEach((q) => {
          const ans = appState.mockAnswers[q.id];
          if (ans !== undefined) {
            appState.reviewAnswers[q.id] = {
              selectedOptIdx: ans,
              isCorrect: q.options[ans].isCorrect,
              confident: null,
            };
          }
        });
        renderPracticeUI();
      }

      window.onload = init;
    </script>
  </body>
</html>
